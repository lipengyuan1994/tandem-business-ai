# Live AI route file (contracts §6), first choice from the AI-04 probe (backend/evals/reports/2026-11-03-probe.md).
# No secrets: the key comes from VULTR_INFERENCE_API_KEY in .env. Vultr only, so every business policy except
# strict_private and regulated can use it. json_schema: true only where the probe showed schema-valid output.
# Prices (USD per million tokens) are the Vultr catalog listing recorded in docs/roadmap/08-ai-layer.md; the live
# catalog publishes no prices. The evals (AI-09) confirm or change the order.
providers:
  vultr: {kind: openai_compat, base_url: "https://api.vultrinference.com/v1", api_key_env: VULTR_INFERENCE_API_KEY, hosted: true, vendor: vultr}
routes:                               # ordered: the first healthy, policy-allowed entry wins
  agent:                              # tool-call probe passed for all three
    - {provider: vultr, model: glm-5.3-flash, json_schema: true, price_in_per_m: 0.35, price_out_per_m: 0.35}
    - {provider: vultr, model: mimo-v2.6-flash, json_schema: true, price_in_per_m: 0.25, price_out_per_m: 0.25}
    - {provider: vultr, model: deepseek-v4.1-flash-1017, json_schema: true, price_in_per_m: 0.60, price_out_per_m: 0.60}
  fast_extract:
    - {provider: vultr, model: qwen3.8-flash-next, json_schema: true, price_in_per_m: 0.20, price_out_per_m: 0.20}
    - {provider: vultr, model: glm-5.3-flash, json_schema: true, price_in_per_m: 0.35, price_out_per_m: 0.35}
  writer:
    - {provider: vultr, model: deepseek-v4.1-flash-1017, json_schema: true, price_in_per_m: 0.60, price_out_per_m: 0.60}
    - {provider: vultr, model: glm-5.3-flash, json_schema: true, price_in_per_m: 0.35, price_out_per_m: 0.35}
  safety:                             # not probed with the SafetyVerdict schema yet: json_object mode
    - {provider: vultr, model: nemotron-3.5-content-safety, price_in_per_m: 0.15, price_out_per_m: 0.15}
limits: {max_steps: 8, max_input_tokens_per_step: 12000, max_output_tokens_per_step: 800, run_timeout_s: 90, step_timeout_s: 30}
