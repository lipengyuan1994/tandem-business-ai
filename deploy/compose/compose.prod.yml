# Production stack: one VM, Docker Compose (docs/roadmap/10-vultr-infrastructure.md#composeprodyml-specification).
# Run from the directory holding this file and `.env` (generated by deploy/scripts/gen-env.sh; /opt/smb on a VM).
# Only the caddy service publishes ports. Postgres, Keycloak, api, worker and backup are reachable inside the
# Compose network only.
name: smb-prod

x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "5" }

x-hardened: &hardened
  restart: unless-stopped
  logging: *logging
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-prod}
  APP_VERSION: ${VERSION}
  APP_BASE_URL: ${PUBLIC_URL:?PUBLIC_URL is required}
  APP_SECRET_KEY: ${APP_SECRET_KEY:?APP_SECRET_KEY is required}
  DATABASE_URL: postgresql+psycopg://smb_app:${SMB_APP_PASSWORD:?}@postgres:5432/smb
  OIDC_ISSUER: ${PUBLIC_URL}/auth/realms/smb
  OIDC_INTERNAL_ISSUER_URL: http://keycloak:8080/auth/realms/smb
  OIDC_CLIENT_ID: smb-app
  OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?OIDC_CLIENT_SECRET is required}
  KEYCLOAK_ADMIN_CLIENT_ID: smb-admin
  KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET:?KEYCLOAK_ADMIN_CLIENT_SECRET is required}
  DATA_PROFILE: ${DATA_PROFILE:-standard}
  # Hosting/backup attestations remain required; they never permit hosted AI under regulated (ADR-020).
  REGULATED_HOST_BAA: ${REGULATED_HOST_BAA:-}
  REGULATED_BACKUP_BAA: ${REGULATED_BACKUP_BAA:-}
  SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-60}
  SMTP_URL: ${SMTP_URL:-}
  SMTP_FROM: ${SMTP_FROM:-}
  EGRESS_ALLOWLIST: ${EGRESS_ALLOWLIST:-}
  WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-4}
  LOG_LEVEL: ${LOG_LEVEL:-info}

# AI layer (docs/roadmap/ai/contracts.md §2): only the api and worker get these (never migrate). The route file lives in
# ./config (mounted read-only at /config); a missing ai-routes.yaml or empty provider keys leave AI disabled.
# Regulated requires local routes/private resolved addresses for every class. Hosted BAA APIs are excluded;
# use ai-routes.local.example.yaml and set LOCAL_INFERENCE_HOSTS to your private model server's DNS name.
x-ai-env: &ai-env
  AI_ROUTES_FILE: ${AI_ROUTES_FILE:-/config/ai-routes.yaml}
  VULTR_INFERENCE_API_KEY: ${VULTR_INFERENCE_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  LOCAL_INFERENCE_HOSTS: ${LOCAL_INFERENCE_HOSTS:-}
  AI_DAILY_TOKEN_BUDGET_PER_BUSINESS: ${AI_DAILY_TOKEN_BUDGET_PER_BUSINESS:-2000000}
  AI_DAILY_COST_LIMIT_USD: ${AI_DAILY_COST_LIMIT_USD:-5.00}
  AI_MONTHLY_COST_LIMIT_USD: ${AI_MONTHLY_COST_LIMIT_USD:-50.00}
  AI_MAX_CONCURRENT_CALLS: ${AI_MAX_CONCURRENT_CALLS:-2}
  AI_PUBLIC_INTAKE_PER_HOUR: ${AI_PUBLIC_INTAKE_PER_HOUR:-30}
  AI_PUBLIC_INTAKE_MAX_PENDING: ${AI_PUBLIC_INTAKE_MAX_PENDING:-30}
  AI_PUBLIC_DAILY_TOKEN_BUDGET_PER_BUSINESS: ${AI_PUBLIC_DAILY_TOKEN_BUDGET_PER_BUSINESS:-200000}
  AI_BUDGET_NOTIFICATION_EMAIL: ${AI_BUDGET_NOTIFICATION_EMAIL:-}

services:
  postgres:
    <<: *hardened
    # Started as the image's own `postgres` user (uid 999 in the Debian-based images) instead of as root: the entrypoint
    # only needs root to chown the data directory and to switch user, and the volume already belongs to 999.
    user: "999:999"
    image: pgvector/pgvector:0.8.7-pg17-bookworm@sha256:ac08538c6f8b9904c33c8224c5e5706dbe760aca29db1d096972b4052c22a75d
    command: ["postgres", "-c", "shared_buffers=256MB", "-c", "max_connections=100", "-c", "idle_in_transaction_session_timeout=60s"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SMB_OWNER_PASSWORD: ${SMB_OWNER_PASSWORD:?}
      SMB_APP_PASSWORD: ${SMB_APP_PASSWORD:?}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD:?}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    mem_limit: 1g
    shm_size: 256m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smb"]
      interval: 5s
      timeout: 5s
      retries: 30

  migrate:
    <<: *hardened
    restart: "no"
    # A rollback keeps the migration image that knows the database's newer revision.
    image: ${REGISTRY:-smb}/smb-api:${MIGRATION_VERSION:-${VERSION:?VERSION is required}}
    command: ["alembic", "upgrade", "head"]
    environment:
      <<: *app-env
      DATABASE_MIGRATION_URL: postgresql+psycopg://smb_owner:${SMB_OWNER_PASSWORD}@postgres:5432/smb
    read_only: true
    tmpfs: ["/tmp"]
    mem_limit: 256m
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *hardened
    stop_grace_period: 120s
    image: ${REGISTRY:-smb}/smb-api:${VERSION}
    environment:
      <<: [*app-env, *ai-env]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - backup_state:/backup-state:ro  # the System page shows the last backup (written by the backup container)
      - ./config:/config:ro            # AI route file (install.sh / upgrade.sh keep ai-routes.yaml)
    mem_limit: 768m
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  worker:
    <<: *hardened
    stop_grace_period: 120s
    image: ${REGISTRY:-smb}/smb-api:${VERSION}
    command: ["python", "-m", "app.worker"]
    environment:
      <<: [*app-env, *ai-env]
    read_only: true
    tmpfs: ["/tmp"]
    volumes:
      - ./config:/config:ro
    mem_limit: 512m
    healthcheck:
      test: ["CMD", "python", "-c", "import os,sys,time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/worker-heartbeat') < 30 else 1)"]
      interval: 15s
      timeout: 5s
      start_period: 40s
      retries: 3
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }

  keycloak:
    <<: *hardened         # the image already runs as uid 1000
    image: quay.io/keycloak/keycloak:26.8.1@sha256:a78d6b79572168cb25886b80a8b5b8d4ed4390743e3eecb810538683e209dd6b
    command: ["start", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: ${PUBLIC_URL}/auth
      # The admin console is reached through an SSH tunnel (docs/runbooks/access.md), never through Caddy.
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      # Single node: local caches, no JGroups clustering (a restart after a crash would otherwise try to join a stale node).
      KC_CACHE: local
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KEYCLOAK_BOOTSTRAP_ADMIN_USER:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD:?KEYCLOAK_BOOTSTRAP_ADMIN_PASSWORD is required}
      JAVA_OPTS_KC_HEAP: "-XX:MaxRAMPercentage=65"
      # Substituted into the realm import (deploy/compose/realm-smb.prod.json).
      PUBLIC_URL: ${PUBLIC_URL}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET}
      KEYCLOAK_ADMIN_CLIENT_SECRET: ${KEYCLOAK_ADMIN_CLIENT_SECRET}
    volumes:
      - ./realm-smb.prod.json:/opt/keycloak/data/import/realm-smb.json:ro
      # Available on all hosts, selected explicitly only on synthetic demos (never in realm imports).
      - ./themes:/opt/keycloak/themes:ro
    mem_limit: 768m
    healthcheck:
      # Healthy only when the realm itself answers: the management "ready" endpoint turns green before the realm
      # import has finished, and anything started then (bootstrap, api login) would get a 503.
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /auth/realms/smb/.well-known/openid-configuration HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && grep -q '\"issuer\"' <&3"]
      interval: 10s
      timeout: 5s
      start_period: 90s
      retries: 20
    depends_on:
      postgres: { condition: service_healthy }

  caddy:
    <<: *hardened         # cap_drop ALL and no-new-privileges, as for api and worker
    # The internet-facing process: a fixed unprivileged user (the same uid as in web.Dockerfile), a read-only root
    # filesystem, and one capability. Binding 80 and 443 does not need it where the engine lowers
    # net.ipv4.ip_unprivileged_port_start, which Docker does by default. NET_BIND_SERVICE stays because the upstream caddy
    # binary carries the file capability cap_net_bind_service+ep: with that capability missing from the bounding set the
    # kernel refuses to start the binary ("operation not permitted"), with or without no-new-privileges (checked). With
    # the capability kept, no-new-privileges still allows the start, and an older image runs under this file too (a
    # rollback). The ports stay 80 and 443 inside, so automatic HTTPS (redirect, ACME challenges) is unchanged.
    user: "10003:10003"
    cap_add: [NET_BIND_SERVICE]
    read_only: true       # Caddy writes only to the two volumes below
    image: ${REGISTRY:-smb}/smb-web:${VERSION}
    environment:
      DOMAIN: ${DOMAIN:?DOMAIN is required}
      # Caddy defaults apply to unset variables only. Compose maps empty/unset to an unused snippet name.
      DEMO_SITE_DOMAIN: ${DEMO_SITE_DOMAIN:-(demo_site_disabled)}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # Owned by uid 10003. A volume that a former root container filled needs `chown`: docs/runbooks/upgrade.md
      # (upgrade.sh does it before it starts the new version).
      - caddy_data:/data      # certificates and the ACME account: must persist
      - caddy_config:/config  # Caddy's autosaved configuration
    mem_limit: 128m
    depends_on:
      api: { condition: service_healthy }
      keycloak: { condition: service_healthy }

  backup:
    <<: *hardened
    image: ${REGISTRY:-smb}/smb-backup:${VERSION}
    command: ["sh", "-c", "backup.sh --startup; exec supercronic /etc/backup.crontab"]
    environment:
      PGHOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      SMB_OWNER_PASSWORD: ${SMB_OWNER_PASSWORD}
      KEYCLOAK_DB_PASSWORD: ${KEYCLOAK_DB_PASSWORD}
      RESTIC_REPOSITORY: ${RESTIC_REPOSITORY:?RESTIC_REPOSITORY is required (an s3:... URL or a path)}
      RESTIC_PASSWORD: ${RESTIC_PASSWORD:?RESTIC_PASSWORD is required}
      AWS_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY:-}
      AWS_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_KEY:-}
    volumes:
      - backup_state:/state
    mem_limit: 256m
    # Wait for the databases to be migrated and initialised so the first backup is not an empty one.
    depends_on:
      postgres: { condition: service_healthy }
      migrate: { condition: service_completed_successfully }
      keycloak: { condition: service_healthy }

volumes:
  pgdata:
  caddy_data:
  caddy_config:
  backup_state:
