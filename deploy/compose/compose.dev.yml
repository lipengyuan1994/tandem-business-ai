# Development stack (task P1-02). Only caddy (8443), the test DB (5433) and the Keycloak admin port (8081)
# are published, and only on 127.0.0.1.
name: smb

x-db-env: &db-env
  POSTGRES_USER: postgres
  POSTGRES_PASSWORD: postgres_dev
  SMB_OWNER_PASSWORD: smb_owner_dev
  SMB_APP_PASSWORD: smb_app_dev
  KEYCLOAK_DB_PASSWORD: keycloak_dev

x-backend: &backend
  build:
    context: ../../backend
    dockerfile: Dockerfile.dev
  env_file: ../../.env
  volumes:
    - ../../backend:/app
    - ../../data:/data:ro
    # AI route files (AI_ROUTES_FILE, AI_FAKE_SCRIPT_FILE in .env): ai-routes.dev.yaml uses the scripted fake provider.
    - ../config:/config:ro
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment: *db-env
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smb"]
      interval: 3s
      retries: 30

  db-test:
    image: pgvector/pgvector:0.8.7-pg17-bookworm
    environment: *db-env
    command: ["postgres", "-c", "fsync=off", "-c", "synchronous_commit=off", "-c", "full_page_writes=off", "-c", "max_connections=200"]
    tmpfs: ["/var/lib/postgresql/data"]
    volumes:
      - ./postgres-init.sh:/docker-entrypoint-initdb.d/10-init.sh:ro
    ports: ["127.0.0.1:5433:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smb"]
      interval: 2s
      retries: 30

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    command: ["start-dev", "--import-realm"]
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak_dev
      KC_HTTP_RELATIVE_PATH: /auth
      KC_HOSTNAME: https://localhost:8443/auth
      KC_HOSTNAME_ADMIN: http://localhost:8081/auth
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_PROXY_HEADERS: xforwarded
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin_dev
    volumes:
      - ../keycloak/realm-smb.dev.json:/opt/keycloak/data/import/realm-smb.json:ro
    ports: ["127.0.0.1:8081:8080"]
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *backend
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:create_app --factory --reload --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips='*'"]

  worker:
    <<: *backend
    # Reloads on *.py changes under app/ (like the api's --reload), so new jobs, executors and subscribers are picked up.
    # watchfiles comes with uvicorn[standard]. sleep 5 gives the api time to migrate (first start only, not on reloads).
    # exec makes watchfiles PID 1, so docker's SIGTERM stops the worker (watchfiles gives it 5 s). A reload sends SIGINT:
    # the worker finishes the jobs it is running, then exits. It waits at most 30 s (worker.py); --sigint-timeout is
    # the SIGKILL backstop just above that. A job abandoned that way is requeued by jobs.reap_stale after its 5 minute lease.
    command: ["sh", "-c", "sleep 5 && exec watchfiles --target-type command --filter python --sigint-timeout 35 'python -m app.worker' /app/app"]
    depends_on:
      api:
        condition: service_started

  web:
    image: node:24-alpine
    working_dir: /app
    command: ["sh", "-c", "corepack enable pnpm && CI=1 pnpm install --frozen-lockfile && pnpm dev --host 0.0.0.0 --port 5173"]
    environment:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      VITE_HMR_CLIENT_PORT: "8443"
    volumes:
      - ../../frontend:/app
      - web_node_modules:/app/node_modules

  caddy:
    image: caddy:2.11.7-alpine
    volumes:
      - ./Caddyfile.dev:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports: ["127.0.0.1:8443:443"]
    depends_on: [api, keycloak, web]

volumes:
  pgdata:
  caddy_data:
  web_node_modules:
