# Lint, type checks and tests on every pull request and every push to main.
# Same commands as `make lint`, `make typecheck`, `make backend-test` and `make frontend-test`.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend-checks:
    name: Backend lint and types
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - run: uv sync --frozen
      - name: Ruff
        run: uv run ruff check . && uv run ruff format --check .
      - name: Mypy
        run: uv run mypy

  backend-tests:
    name: Backend tests (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: backend/uv.lock
      - name: Install dependencies
        working-directory: backend
        run: uv sync --frozen
      # The throwaway Postgres from compose.dev.yml (pgvector, roles from postgres-init.sh) on localhost:5433,
      # exactly as `make test-db` starts it locally.
      - name: Start test database
        run: make test-db
      # Each shard gets about a quarter of the run time, from the per-file seconds in
      # .github/backend-test-durations.json (see .github/scripts/backend_shard.py), against its own database.
      - name: Run tests
        working-directory: backend
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t files < <(python3 ../.github/scripts/backend_shard.py "$SHARD" 4)
          echo "Shard $SHARD: ${#files[@]} test files"
          uv run pytest -q --junitxml=junit.xml "${files[@]}"
      # Seconds per file, to refresh .github/backend-test-durations.json when the shards drift apart.
      - name: Test file durations
        if: always()
        working-directory: backend
        run: test -f junit.xml && python3 ../.github/scripts/backend_shard.py --durations junit.xml || true

  frontend:
    name: Frontend lint, types and tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      # Node 24 is what the app is built with (deploy/docker/web.Dockerfile); the dictation tests fail on Node 22.
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Type check
        run: pnpm typecheck
      - name: Tests
        run: pnpm test
